<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cindy's Resume</title> <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Cindy Rusznyak</h1>
        <h2>Full Stack Developer</h2>
        <p>Get to know me - One note at a time</p>
    </header>
        <main>

            <section class="piano-section"> 
                <h2>♪ Play my Resume ♪</h2>

                <div class="music-line"></div>

                <div class="piano">
                    <div class="white-key">
                    <button class="white-button" id="key-c">C</button>
                    <button class="black-key">C#</button>
                    </div>

                    <div class="white-key">
                    <button class="white-button" id="key-d">D</button>
                    <button class="black-key">D#</button>
                    </div>

                    <div class="white-key">
                    <button class="white-button" id="key-e">E</button>
                    </div>

                    <div class="white-key">
                    <button class="white-button" id="key-f">F</button>
                    <button class="black-key">F#</button>
                    </div>

                    <div class="white-key">
                    <button  class="white-button" id="key-g">G</button>
                    <button class="black-key">G#</button>
                    </div>

                    <div class="white-key">
                    <button class="white-button" id="key-a">A</button>
                    <button class="black-key">A#</button>
                    </div>

                    <div class="white-key">
                    <button class="white-button" id="key-b">B</button>
                    </div>

                </div>
            </section>

            <section id="information" class="information">

            </section>
        </main>
        <footer>
            <p>♪ One note at a time ♪</p>
            <p>Made with code & a little music.</p>
            <p>© 2026 Cindy Rusznyak</p>
        </footer>
 <script src="script.js"></script>
</body>
</html>
